<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#06265A"/>
      <stop offset="75%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#020617"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#0A66C2" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity=".8"/>
      <stop offset="55%" stop-color="#BAE6FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55" fill="none" stroke="#38BDF8" stroke-opacity=".12"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="520" fill="#020617"/>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>
  <rect width="1600" height="520" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="55 55" dur="8s" repeatCount="indefinite"/>
  </rect>

  <ellipse cx="800" cy="270" rx="520" ry="210" fill="#38BDF8" opacity=".10" filter="url(#blur)">
    <animate attributeName="rx" values="520;650;520" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".06;.18;.06" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#BAE6FD">
    <circle cx="120" cy="110" r="2"><animate attributeName="cy" values="110;70;110" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="390" r="2.5"><animate attributeName="cy" values="390;330;390" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="90" r="1.8"><animate attributeName="cy" values="90;45;90" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="430" r="2"><animate attributeName="cy" values="430;375;430" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="95" r="2.5"><animate attributeName="cy" values="95;55;95" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1290" cy="350" r="2"><animate attributeName="cy" values="350;295;350" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1490" cy="135" r="2.5"><animate attributeName="cy" values="135;90;135" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity=".8" filter="url(#soft)">
    <rect x="-500" y="118" width="500" height="3" fill="url(#beam)" rx="3">
      <animate attributeName="x" from="-500" to="1700" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-700" y="365" width="700" height="2" fill="url(#beam)" rx="2">
      <animate attributeName="x" from="-700" to="1800" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M0 420 Q400 300 800 390 T1600 330" fill="none" stroke="#38BDF8" stroke-opacity=".18" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".08;.35;.08" dur="6s" repeatCount="indefinite"/>
  </path>

  <rect x="22" y="22" width="1556" height="476" rx="24" fill="none" stroke="#38BDF8" stroke-opacity=".25"/>
  <rect x="35" y="35" width="1530" height="450" rx="20" fill="none" stroke="#BAE6FD" stroke-opacity=".07"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="800" y="205" fill="#E0F2FE" font-size="58" font-weight="800" letter-spacing="8">
      MD SHAKIL AHAMED
    </text>
    <text x="800" y="255" fill="#38BDF8" font-size="20" font-weight="700" letter-spacing="7">
      DATA SCIENCE  •  PYTHON  •  BUILDER
    </text>
    <text x="800" y="315" fill="#CBD5E1" font-size="15" letter-spacing="3">
      TURNING DATA INTO DECISIONS  //  BUILDING WHAT MATTERS
    </text>
  </g>
</svg>