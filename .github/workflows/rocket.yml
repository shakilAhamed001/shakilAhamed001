name: 🚀 Rocket Game Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rocket-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Rocket Game
        run: |
          mkdir -p dist/rocket

          cat > dist/rocket/rocket-game.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1000"
               height="400"
               viewBox="0 0 1000 400">

            <defs>

              <!-- Background -->
              <linearGradient id="space"
                x1="0" y1="0"
                x2="1" y2="1">

                <stop offset="0%" stop-color="#020617"/>
                <stop offset="50%" stop-color="#111827"/>
                <stop offset="100%" stop-color="#020617"/>

              </linearGradient>

              <!-- Rocket flame -->
              <linearGradient id="fire"
                x1="0" y1="0"
                x2="0" y2="1">

                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="25%" stop-color="#00ffff"/>
                <stop offset="60%" stop-color="#ffff00"/>
                <stop offset="100%" stop-color="#ff0000"/>

              </linearGradient>

              <!-- Glow -->
              <filter id="glow">

                <feGaussianBlur
                  stdDeviation="5"
                  result="blur"/>

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>

              </filter>

            </defs>


            <!-- ======================= -->
            <!-- SPACE BACKGROUND -->
            <!-- ======================= -->

            <rect
              width="1000"
              height="400"
              rx="25"
              fill="url(#space)"/>


            <!-- ======================= -->
            <!-- STARS -->
            <!-- ======================= -->

            <g fill="#ffffff">

              <circle cx="50" cy="70" r="2">
                <animate
                  attributeName="opacity"
                  values="1;0.2;1"
                  dur="1.2s"
                  repeatCount="indefinite"/>
              </circle>

              <circle cx="140" cy="160" r="2"/>
              <circle cx="220" cy="80" r="2"/>
              <circle cx="310" cy="220" r="2"/>
              <circle cx="390" cy="70" r="2"/>
              <circle cx="600" cy="100" r="2"/>
              <circle cx="700" cy="210" r="2"/>
              <circle cx="820" cy="80" r="2"/>
              <circle cx="930" cy="170" r="2"/>

            </g>


            <!-- ======================= -->
            <!-- MOVING STAR PARTICLES -->
            <!-- ======================= -->

            <g fill="#00ffff">

              <rect x="1000" y="90"
                    width="40"
                    height="2">

                <animate
                  attributeName="x"
                  from="1000"
                  to="-60"
                  dur="2s"
                  repeatCount="indefinite"/>

              </rect>

              <rect x="1000" y="180"
                    width="25"
                    height="2">

                <animate
                  attributeName="x"
                  from="1000"
                  to="-50"
                  dur="1.5s"
                  repeatCount="indefinite"/>

              </rect>

              <rect x="1000" y="290"
                    width="50"
                    height="2">

                <animate
                  attributeName="x"
                  from="1000"
                  to="-70"
                  dur="2.5s"
                  repeatCount="indefinite"/>

              </rect>

            </g>


            <!-- ======================= -->
            <!-- ASTEROID 1 -->
            <!-- ======================= -->

            <g filter="url(#glow)">

              <g>

                <circle
                  cx="900"
                  cy="120"
                  r="25"
                  fill="#6b7280"/>

                <circle
                  cx="890"
                  cy="110"
                  r="7"
                  fill="#374151"/>

                <circle
                  cx="910"
                  cy="130"
                  r="5"
                  fill="#374151"/>

                <animateTransform
                  attributeName="transform"
                  type="translate"
                  from="150 0"
                  to="-1050 0"
                  dur="5s"
                  repeatCount="indefinite"/>

                <animateTransform
                  attributeName="transform"
                  type="rotate"
                  from="0 900 120"
                  to="360 900 120"
                  dur="2s"
                  repeatCount="indefinite"
                  additive="sum"/>

              </g>


              <!-- ASTEROID 2 -->

              <g>

                <circle
                  cx="850"
                  cy="280"
                  r="18"
                  fill="#9ca3af"/>

                <circle
                  cx="844"
                  cy="275"
                  r="5"
                  fill="#374151"/>

                <animateTransform
                  attributeName="transform"
                  type="translate"
                  from="200 0"
                  to="-1100 0"
                  dur="4s"
                  repeatCount="indefinite"/>

              </g>

            </g>


            <!-- ======================= -->
            <!-- ROCKET -->
            <!-- ======================= -->

            <g filter="url(#glow)">

              <g>

                <!-- Floating movement -->

                <animateTransform
                  attributeName="transform"
                  type="translate"
                  values="0 0; 0 -15; 0 0; 0 15; 0 0"
                  dur="1.2s"
                  repeatCount="indefinite"/>


                <!-- Rocket body -->

                <path
                  d="
                  M450 105
                  C425 135 425 200 450 230
                  L490 230
                  C515 200 515 135 490 105
                  Z"
                  fill="#f8fafc"
                  stroke="#00ffff"
                  stroke-width="3"/>


                <!-- Nose -->

                <path
                  d="
                  M450 105
                  Q470 65 490 105
                  Z"
                  fill="#ef4444"/>


                <!-- Window -->

                <circle
                  cx="470"
                  cy="140"
                  r="17"
                  fill="#0ea5e9"
                  stroke="#ffffff"
                  stroke-width="4"/>

                <circle
                  cx="465"
                  cy="135"
                  r="5"
                  fill="#ffffff"/>


                <!-- Left wing -->

                <path
                  d="
                  M450 175
                  L405 220
                  L450 210
                  Z"
                  fill="#ef4444"/>


                <!-- Right wing -->

                <path
                  d="
                  M490 175
                  L535 220
                  L490 210
                  Z"
                  fill="#ef4444"/>


                <!-- Rocket flame -->

                <path
                  d="
                  M450 225
                  Q470 300 490 225
                  Q470 250 450 225"
                  fill="url(#fire)">

                  <animate
                    attributeName="d"
                    values="
                    M450 225 Q470 285 490 225 Q470 245 450 225;
                    M450 225 Q470 325 490 225 Q470 260 450 225;
                    M450 225 Q470 270 490 225 Q470 240 450 225"
                    dur="0.25s"
                    repeatCount="indefinite"/>

                </path>

              </g>

            </g>


            <!-- ======================= -->
            <!-- GAME HUD -->
            <!-- ======================= -->

            <rect
              x="25"
              y="20"
              width="280"
              height="55"
              rx="12"
              fill="#020617"
              stroke="#00ffff"
              stroke-width="2"/>

            <text
              x="45"
              y="56"
              fill="#00ffff"
              font-family="monospace"
              font-size="23"
              font-weight="bold">

              🚀 ROCKET GAME

            </text>


            <!-- LEVEL -->

            <text
              x="700"
              y="48"
              fill="#22ff88"
              font-family="monospace"
              font-size="20"
              font-weight="bold">

              LEVEL 01

              <animate
                attributeName="opacity"
                values="1;0.5;1"
                dur="1s"
                repeatCount="indefinite"/>

            </text>


            <!-- SCORE -->

            <text
              x="700"
              y="75"
              fill="#ffff00"
              font-family="monospace"
              font-size="18">

              SCORE: 9999+

            </text>


            <!-- ======================= -->
            <!-- GAME MESSAGE -->
            <!-- ======================= -->

            <text
              x="500"
              y="330"
              text-anchor="middle"
              fill="#22ff88"
              font-family="monospace"
              font-size="22"
              font-weight="bold">

              &gt; AVOID ASTEROIDS!

              <animate
                attributeName="opacity"
                values="1;0.4;1"
                dur="1s"
                repeatCount="indefinite"/>

            </text>


            <!-- ======================= -->
            <!-- LEVEL UP -->
            <!-- ======================= -->

            <text
              x="500"
              y="365"
              text-anchor="middle"
              fill="#a855f7"
              font-family="monospace"
              font-size="18">

              ⭐ LEVEL UP • KEEP CODING • KEEP FLYING ⭐

              <animate
                attributeName="opacity"
                values="0.4;1;0.4"
                dur="1.5s"
                repeatCount="indefinite"/>

            </text>


            <!-- BORDER -->

            <rect
              x="5"
              y="5"
              width="990"
              height="390"
              rx="25"
              fill="none"
              stroke="#2563eb"
              stroke-width="3"/>

          </svg>
          EOF


      # ============================
      # PUBLISH
      # ============================

      - name: Publish Rocket Game
        run: |

          git fetch origin output:output || true

          git checkout -B output

          mkdir -p rocket

          cp dist/rocket/rocket-game.svg \
             rocket/rocket-game.svg

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rocket/rocket-game.svg

          git diff --cached --quiet || \
            git commit \
            -m "🚀 Update rocket game animation"

          git push origin output
